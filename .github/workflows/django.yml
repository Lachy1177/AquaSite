name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # Updated to modern Python versions. 
        # (Change back to 3.8/3.9 if your server specifically requires older versions)
        python-version: ["3.13"] 

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Updated to the latest v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Tests
      env:
        # If settings.py crashes without a SECRET_KEY, this provides a fake one just for the test runner.
        SECRET_KEY: "dummy-secret-key-for-github-actions"
      run: |
        python manage.py test
